# vector/vdvec.s as a PRG; the start address comes from ld65 -S (the VICE build: $C000, below the mock's mailbox at $C800).
MEMORY {
    HDR: start = %S - 2, size = 2,     file = %O;
    RAM: start = %S,     size = $0800, file = %O;
}
SEGMENTS {
    LOADADDR: load = HDR, type = ro;
    CODE:     load = RAM, type = rw;
}
