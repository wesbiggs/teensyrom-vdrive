# Build artifacts: everything a release ships, attached to the GitHub release when one is published.
# Firmware: three hex files with tools/build_firmware.sh (the TeensyROM commit in firmware/UPSTREAM + firmware/teensyrom-vdrive.patch,
# TeensyROM's own build script):
#   tr           TeensyROM_<ver>_full.hex        plain TR, without DMA LOAD
#   tr-plus      TeensyROM+_<ver>_full.hex       TR+, without DMA LOAD (the VD_DMA_LOAD=0 build, docs/DESIGN.md 49)
#   tr-plus-dma  TeensyROM+_<ver>-DMA_full.hex   TR+ with DMA LOAD (Fab04_VDriveDMALoad; the version on the menu reads <ver>-DMA)
# The plain TR hex has no VDrive yet (VDrive sits under Fab04_KernalReplace, TR+ only); it is built so the release carries both boards' files.
# Test files (tools/make_testdisk.py, tests/basic/README.md), to copy to the root of the SD card or USB stick:
#   vdtest.d64   VDSUITE, DMATEST, LOADTEST's data files, HELLO, BIG, VDCOPY, VDrive Config
#   vdbad.d64    VDSUITE's bad-sector image (section 5)
#   vdplain.prg  VDSUITE's plain card file (section 6)
# Runs only on demand: publishing a release, or a manual run (Actions tab, "Run workflow"), which builds them all and keeps them as
# workflow artifacts without touching any release (run it before cutting a release to see that the patch still builds).
name: build artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [tr, tr-plus, tr-plus-dma]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # TeensyROM's package.json: "node": ">=24"

      - name: Cache Arduino core and library
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-teensy-1.61.0-crc32-2.0.1

      # ca65/ld65: the builds without DMA LOAD rebuild the KERNAL table with tools/build.py -D VD_DMA_LOAD=0
      - name: Install cc65
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cc65

      - name: Build ${{ matrix.target }}
        run: tools/build_firmware.sh ${{ matrix.target }} build/release --install-toolchain

      # The hex name carries the firmware version (TeensyROM+_0.9.0.45_full.hex); a release tag v<version> must match it,
      # so a tag made before firmware/REV was bumped (or on the wrong commit) does not ship a mislabelled file.
      - name: Check the version against the tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          hex=$(ls build/release/*.hex)
          ver=$(basename "$hex" | sed -E 's/^TeensyROM\+?_(.*)_full\.hex$/\1/; s/-DMA$//')
          echo "hex $hex, version $ver, tag $TAG"
          case "$TAG" in
            v[0-9]*) [ "$TAG" = "v$ver" ] || { echo "::error::tag $TAG does not match the firmware version $ver (firmware/REV)"; exit 1; } ;;
            *) echo "::warning::tag $TAG is not v<version>; not compared with $ver" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: build/release/*.hex
          if-no-files-found: error

  testfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # c1541 and petcat (Ubuntu's vice package; no ROMs needed for these), ca65/ld65 for VDSUITE's machine code and the utilities
      - name: Install VICE tools and cc65
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vice cc65

      - name: Build the test disk and the card files
        run: |
          python3 -I tools/make_testdisk.py build/testdisk
          mkdir -p build/testfiles
          cp build/testdisk/vdtest.d64 build/testdisk/vdbad.d64 build/testdisk/vdplain.prg build/testfiles/

      - uses: actions/upload-artifact@v7
        with:
          name: testfiles
          path: build/testfiles/*
          if-no-files-found: error

  attach:
    needs: [build, testfiles]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: hex

      - uses: actions/download-artifact@v8
        with:
          name: testfiles
          path: testfiles

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l hex testfiles
          [ "$(ls hex/*.hex | wc -l)" = 3 ] || { echo "::error::expected three hex files"; exit 1; }
          for f in vdtest.d64 vdbad.d64 vdplain.prg; do [ -f "testfiles/$f" ] || { echo "::error::$f missing"; exit 1; }; done
          gh release upload "$TAG" hex/*.hex testfiles/vdtest.d64 testfiles/vdbad.d64 testfiles/vdplain.prg --clobber --repo "$GITHUB_REPOSITORY"
